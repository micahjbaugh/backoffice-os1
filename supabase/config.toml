# Supabase CLI configuration for local development (`supabase start`).
# Only settings this project depends on are listed; the CLI supplies defaults for the rest.

project_id = "backoffice-os"

[api]
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
port = 54323

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
enable_signup = true
# Short-lived access tokens; the proxy refreshes sessions.
jwt_expiry = 3600

[auth.email]
enable_signup = true
# Local only. Enable confirmations in hosted projects.
enable_confirmations = false
