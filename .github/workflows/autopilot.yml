# Back Office OS autopilot (v2): Claude builds, the OpenAI reviewer reviews, a deterministic referee
# decides. Runs in GitHub's cloud every 30 minutes; one turn per run:
#
#   build     Claude makes one step -> referee runs the checks -> referee judges the step
#   validate  re-run the checks on a finished task (after an infrastructure failure)
#   review    reviewer judges the COMPLETE task diff (in tracked parts), only on validated code
#
# Progress lives in the `autopilot` branch (workflow/state.json, blueprint.json, history.jsonl,
# STATUS.md). The referee and its config always come from the default branch, so the autopilot
# branch can never loosen its own rules. See workflow/README.md.
#
# Controls: Actions tab -> "autopilot" -> Run workflow -> command
#   step | pause | resume | resume-mark-done | mark-task-done (+ task id)
# Kill switch: disable the workflow, or set "enabled": false in workflow/config.json on main.
#
# Public-repo safety: only schedule/workflow_dispatch triggers (write access needed). Never add
# pull_request_target, issues or issue_comment triggers.

name: autopilot

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      command:
        description: What to do
        type: choice
        options: [step, pause, resume, resume-mark-done, mark-task-done]
        default: step
      task_id:
        description: Task id for mark-task-done (e.g. M2-T17)
        type: string
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: autopilot
  cancel-in-progress: false

env:
  AUTOPILOT_BRANCH: autopilot
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  turn:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Trusted referee + config come from the default branch, never from the autopilot branch.
      - name: Pin referee and config from the default branch
        run: |
          cp -r workflow/scripts "$RUNNER_TEMP/referee"
          cp workflow/config.json "$RUNNER_TEMP/config.json"
          {
            echo "REFEREE=$RUNNER_TEMP/referee/autopilot.mjs"
            echo "AUTOPILOT_CONFIG=$RUNNER_TEMP/config.json"
            echo "AUTOPILOT_ERROR_FILE=$RUNNER_TEMP/autopilot-error.txt"
            echo "GATE_FILE=$RUNNER_TEMP/gate.json"
          } >> "$GITHUB_ENV"

      - name: Switch to the autopilot branch
        run: |
          git config user.name "backoffice-autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$AUTOPILOT_BRANCH" >/dev/null; then
            git checkout -B "$AUTOPILOT_BRANCH" "origin/$AUTOPILOT_BRANCH"
          else
            git checkout -B "$AUTOPILOT_BRANCH"
            git push -u origin "$AUTOPILOT_BRANCH"
          fi

      # Keep CLAUDE.md, docs and rule changes on main visible to both engineers. GITHUB_TOKEN may not
      # push commits that change .github/workflows; then a person merges main -> autopilot once.
      - name: Bring in the latest rules from main
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! git merge --no-edit "origin/$DEFAULT_BRANCH"; then
            git merge --abort || true
            echo "::warning title=Could not merge $DEFAULT_BRANCH into autopilot::Merge conflict; continuing without the latest rules."
          elif ! git push origin "HEAD:$AUTOPILOT_BRANCH"; then
            git reset --hard "origin/$AUTOPILOT_BRANCH"
            echo "::warning title=Merge of $DEFAULT_BRANCH not pushed::It likely changes .github/workflows; merge it into autopilot manually once."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Human control command
        id: control
        if: github.event_name == 'workflow_dispatch' && inputs.command != 'step'
        env:
          COMMAND: ${{ inputs.command }}
          TASK_ID: ${{ inputs.task_id }}
        run: node "$REFEREE" "$COMMAND"

      - name: Decide this run's action
        id: next
        if: steps.control.outcome == 'skipped'
        run: node "$REFEREE" next

      - name: Save referee bookkeeping
        if: steps.control.outcome == 'success' || steps.next.outputs.state_changed == 'true'
        run: |
          git add workflow/
          git diff --cached --quiet || git commit -m "autopilot: referee update"
          git push origin "HEAD:$AUTOPILOT_BRANCH"

      # ---------------------------------------------------------- build / validate: environment
      - uses: pnpm/action-setup@v4
        if: steps.next.outputs.action == 'build' || steps.next.outputs.action == 'validate'

      - name: Install dependencies (clean, frozen lockfile)
        id: install
        if: steps.next.outputs.action == 'build' || steps.next.outputs.action == 'validate'
        continue-on-error: true
        run: |
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          pnpm install --frozen-lockfile 2>&1 | tail -n 40 | tee "$AUTOPILOT_ERROR_FILE"
          exit "${PIPESTATUS[0]}"

      - name: Install failed - record as infrastructure, retry next run
        id: install_failed
        if: steps.install.outcome == 'failure'
        run: node "$REFEREE" record-error infra

      # ------------------------------------------------------------------------ build: Claude
      - name: Claude builds one step
        id: claude
        if: steps.next.outputs.action == 'build' && steps.install.outcome == 'success'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: ${{ steps.next.outputs.prompt }}
          claude_args: >-
            --model ${{ steps.next.outputs.builder_model }}
            --max-turns ${{ steps.next.outputs.builder_max_turns }}
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(pnpm:*),Bash(node:*),Bash(npx:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git apply:*),Bash(ls:*),Bash(docker:*),Bash(curl:*)"

      - name: Capture Claude's error (if any) for the referee
        if: steps.next.outputs.action == 'build' && steps.install.outcome == 'success' && steps.claude.outcome != 'success'
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          MESSAGE="$(node -e '
            const fs = require("fs");
            try {
              const log = JSON.parse(fs.readFileSync(process.env.EXEC_FILE, "utf8"));
              const r = [].concat(log).reverse().find((m) => m && m.type === "result");
              console.log(String(r?.result ?? r?.subtype ?? "no result message").replace(/\s+/g, " ").slice(0, 600));
            } catch (e) { console.log("no Claude output file: " + e.message); }
          ')"
          echo "::warning title=Claude reported an error::$MESSAGE"
          echo "ERROR_MESSAGE=$MESSAGE" >> "$GITHUB_ENV"

      - name: Did the builder finish its step?
        id: assess
        if: steps.next.outputs.action == 'build' && steps.install.outcome == 'success'
        run: node "$REFEREE" assess

      # ------------------------------------------------------------------ checks (deterministic)
      - name: Gate (format, lint, typecheck, tests, build, secret scan, timezones)
        if: steps.install.outcome == 'success' && (steps.next.outputs.action == 'validate' || steps.assess.outputs.finished == 'true')
        run: node "$REFEREE" gate --out "$GATE_FILE"

      - name: Referee judges the step
        id: finish
        if: steps.next.outputs.action == 'build' && steps.install.outcome == 'success'
        run: node "$REFEREE" finish-build

      - name: Referee records the validation
        id: finish_validate
        if: steps.next.outputs.action == 'validate' && steps.install.outcome == 'success'
        run: node "$REFEREE" finish-validate

      - name: Save build/validation
        if: steps.finish.outputs.commit == 'true' || steps.finish_validate.outputs.commit == 'true' || steps.install_failed.outcome == 'success'
        env:
          MSG: ${{ steps.finish.outputs.message || steps.finish_validate.outputs.message || 'autopilot - dependency install failed (will retry)' }}
        run: |
          git add -A
          git diff --cached --quiet || git commit -m "$MSG"
          git push origin "HEAD:$AUTOPILOT_BRANCH"

      # ----------------------------------------------------------------------------- review
      - name: Reviewer judges the complete task
        id: review
        if: steps.next.outputs.action == 'review' || steps.finish.outputs.review_now == 'true' || steps.finish_validate.outputs.review_now == 'true'
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node "$REFEREE" review

      - name: Review failed - record why, retry next run
        id: review_failed
        if: steps.review.outcome == 'failure'
        run: |
          git checkout -- workflow/
          node "$REFEREE" record-error reviewer

      - name: Save review
        if: steps.review.outputs.commit == 'true' || steps.review_failed.outcome == 'success'
        env:
          MSG: ${{ steps.review.outputs.message || 'autopilot - review run failed (will retry)' }}
        run: |
          git add workflow/
          git diff --cached --quiet || git commit -m "$MSG"
          git push origin "HEAD:$AUTOPILOT_BRANCH"

      # -------------------------------------------------------------------------- reporting
      - name: Notify if a person is needed
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node "$REFEREE" notify

      - name: Summary
        if: always()
        run: node "$REFEREE" status >> "$GITHUB_STEP_SUMMARY" || true
